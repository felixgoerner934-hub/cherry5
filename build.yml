name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      - name: Pruefen ob die jar eine gueltige Fabric-Mod ist
        run: |
          ls -la build/libs
          for f in build/libs/*.jar; do
            echo "Inhalt von $f:"
            unzip -l "$f"
            unzip -l "$f" | grep -q "fabric.mod.json" || { echo "FEHLER: fabric.mod.json fehlt in der jar (src/main/resources/fabric.mod.json im Repository pruefen)"; exit 1; }
            unzip -l "$f" | grep -q "SpawnerBeaconClient.class" || { echo "FEHLER: SpawnerBeaconClient.class fehlt in der jar"; exit 1; }
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SpawnerBeacon-jar
          path: build/libs/*.jar
